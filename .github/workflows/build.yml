name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只读权限；发布 Release 的 job 会单独提升为 contents: write
permissions:
  contents: read

# 同一分支/标签上只保留最新一次构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            key: linux
            builder_args: --linux
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
          - name: Windows
            os: windows-latest
            key: windows
            builder_args: --win
            cache_paths: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 缓存 Electron 二进制与 electron-builder 的下载产物，避免每次重下 ~100MB
      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_paths }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      # vite.config.js 里 base 为 './'，成品可直接被 file:// 加载
      - name: Build renderer (Vite)
        run: npm run build

      # electron-builder 在 Linux 只认 build/icon.png，仓库里目前只有 icon.ico
      - name: Prepare Linux icon
        if: matrix.key == 'linux'
        shell: bash
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          convert 'build/icon.ico[0]' -resize 512x512 -background none -gravity center -extent 512x512 build/icon.png
          file build/icon.png

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrc-model-viewer-${{ matrix.key }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -print

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
